<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="85%" cy="20%" r="15%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#sky)"/>
  <rect width="1280" height="320" fill="url(#moonGlow)"/>

  <!-- Stars -->
  <circle cx="120" cy="45" r="1.2" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="80" r="1" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="30" r="1.5" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="60" r="1" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="40" r="1.3" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="90" r="1" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="0.8" fill="#fff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="100" r="1.1" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Cityscape silhouette -->
  <g fill="#08081a" opacity="0.9">
    <!-- Buildings -->
    <rect x="0" y="220" width="60" height="100"/>
    <rect x="55" y="180" width="45" height="140"/>
    <rect x="95" y="200" width="70" height="120"/>
    <rect x="160" y="160" width="40" height="160"/>
    <rect x="195" y="190" width="55" height="130"/>
    <rect x="245" y="210" width="50" height="110"/>
    <rect x="290" y="170" width="65" height="150"/>
    <rect x="350" y="195" width="45" height="125"/>
    <rect x="390" y="150" width="55" height="170"/>
    <rect x="440" y="185" width="60" height="135"/>
    <rect x="495" y="205" width="40" height="115"/>
    <rect x="530" y="165" width="70" height="155"/>
    <rect x="595" y="190" width="50" height="130"/>
    <rect x="640" y="175" width="55" height="145"/>
    <rect x="690" y="200" width="45" height="120"/>
    <rect x="730" y="155" width="60" height="165"/>
    <rect x="785" y="185" width="50" height="135"/>
    <rect x="830" y="210" width="65" height="110"/>
    <rect x="890" y="170" width="45" height="150"/>
    <rect x="930" y="195" width="55" height="125"/>
    <rect x="980" y="160" width="50" height="160"/>
    <rect x="1025" y="180" width="60" height="140"/>
    <rect x="1080" y="205" width="45" height="115"/>
    <rect x="1120" y="175" width="55" height="145"/>
    <rect x="1170" y="195" width="50" height="125"/>
    <rect x="1215" y="215" width="65" height="105"/>
  </g>

  <!-- Building window lights -->
  <g fill="#e74c3c" opacity="0.3">
    <rect x="105" y="215" width="4" height="4"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="115" y="225" width="4" height="4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="170" y="175" width="4" height="4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="300" y="185" width="4" height="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="310" y="200" width="4" height="4"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="400" y="165" width="4" height="4"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="540" y="180" width="4" height="4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="5.5s" repeatCount="indefinite"/></rect>
    <rect x="650" y="190" width="4" height="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="740" y="170" width="4" height="4"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.8s" repeatCount="indefinite"/></rect>
    <rect x="900" y="185" width="4" height="4"><animate attributeName="opacity" values="0.6;0.9;0.6" dur="5.2s" repeatCount="indefinite"/></rect>
    <rect x="990" y="175" width="4" height="4"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.3s" repeatCount="indefinite"/></rect>
    <rect x="1130" y="190" width="4" height="4"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- === WEB SHOOT LINES (behind spider-man) === -->
  <!-- Line 1: top anchor to swing path -->
  <line x1="200" y1="0" x2="400" y2="80" stroke="#cccccc" stroke-width="0.8" opacity="0.5"
        stroke-dasharray="280" stroke-dashoffset="280">
    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="0.8s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.5;0.7;0.3" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </line>
  <!-- Line 2 -->
  <line x1="500" y1="0" x2="620" y2="60" stroke="#cccccc" stroke-width="0.6" opacity="0.4"
        stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="0.6s" begin="1.8s" fill="freeze"/>
    <animate attributeName="opacity" values="0.4;0.6;0.2" dur="4s" begin="2.4s" repeatCount="indefinite"/>
  </line>
  <!-- Line 3 -->
  <line x1="800" y1="0" x2="850" y2="50" stroke="#cccccc" stroke-width="0.7" opacity="0.45"
        stroke-dasharray="180" stroke-dashoffset="180">
    <animate attributeName="stroke-dashoffset" from="180" to="0" dur="0.5s" begin="3.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0.45;0.65;0.25" dur="4s" begin="3.7s" repeatCount="indefinite"/>
  </line>
  <!-- Line 4 -->
  <line x1="1050" y1="0" x2="1020" y2="70" stroke="#cccccc" stroke-width="0.6" opacity="0.35"
        stroke-dasharray="210" stroke-dashoffset="210">
    <animate attributeName="stroke-dashoffset" from="210" to="0" dur="0.5s" begin="4.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.35;0.55;0.2" dur="4s" begin="5s" repeatCount="indefinite"/>
  </line>

  <!-- === SPIDER-MAN SILHOUETTE === -->
  <g>
    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      path="M-80,120 C200,-40 500,200 700,60 S1000,180 1360,40"
      rotate="auto"
      keyPoints="0;1"
      keyTimes="0;1"
      calcMode="spline"
      keySplines="0.42 0 0.58 1"
    />

    <!-- Spider-Man body silhouette -->
    <g transform="translate(0,0) scale(1)">
      <!-- Head -->
      <ellipse cx="0" cy="-22" rx="9" ry="10" fill="#c0392b"/>
      <!-- Eyes (white) -->
      <ellipse cx="-3" cy="-24" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="4" cy="-24" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.9"/>
      <!-- Body -->
      <path d="M0,-12 L-7,5 L-5,18 L0,15 L5,18 L7,5 Z" fill="#c0392b"/>
      <!-- Spider emblem on chest -->
      <circle cx="0" cy="0" r="2" fill="#1a1a1a"/>
      <line x1="-3" y1="-1" x2="0" y2="0" stroke="#1a1a1a" stroke-width="0.5"/>
      <line x1="3" y1="-1" x2="0" y2="0" stroke="#1a1a1a" stroke-width="0.5"/>
      <line x1="-2" y1="2" x2="0" y2="0" stroke="#1a1a1a" stroke-width="0.5"/>
      <line x1="2" y1="2" x2="0" y2="0" stroke="#1a1a1a" stroke-width="0.5"/>
      <!-- Left arm (web shooting pose) -->
      <path d="M-7,2 L-20,-8 L-22,-6" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Right arm -->
      <path d="M7,2 L18,8 L22,12" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Left leg -->
      <path d="M-4,15 L-10,30 L-14,38" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Right leg -->
      <path d="M4,15 L12,32 L16,38" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Web line shooting from left hand -->
      <line x1="-22" y1="-6" x2="-22" y2="-80" stroke="#aaaaaa" stroke-width="0.8" opacity="0.6"
            stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.3s" begin="0.8s" fill="freeze"/>
      </line>
      <line x1="-22" y1="-6" x2="-10" y2="-90" stroke="#aaaaaa" stroke-width="0.6" opacity="0.4"
            stroke-dasharray="90" stroke-dashoffset="90">
        <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.3s" begin="0.85s" fill="freeze"/>
      </line>
      <line x1="-22" y1="-6" x2="-35" y2="-85" stroke="#aaaaaa" stroke-width="0.6" opacity="0.4"
            stroke-dasharray="85" stroke-dashoffset="85">
        <animate attributeName="stroke-dashoffset" from="85" to="0" dur="0.3s" begin="0.9s" fill="freeze"/>
      </line>

      <!-- Web shooters (wrist glow) -->
      <circle cx="-22" cy="-6" r="2" fill="#e74c3c" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0.3;0.8;0" dur="1s" begin="0.7s" fill="freeze"/>
      </circle>
    </g>
  </g>

  <!-- Red accent glow at bottom -->
  <rect x="0" y="280" width="1280" height="40" fill="url(#glow)" opacity="0.4"/>

  <!-- Subtle web pattern overlay (very faint) -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04" fill="none">
    <circle cx="640" cy="160" r="60"/>
    <circle cx="640" cy="160" r="120"/>
    <circle cx="640" cy="160" r="180"/>
    <circle cx="640" cy="160" r="240"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="400" y1="0" x2="880" y2="320"/>
    <line x1="880" y1="0" x2="400" y2="320"/>
    <line x1="300" y1="160" x2="980" y2="160"/>
    <line x1="440" y1="30" x2="840" y2="290"/>
    <line x1="840" y1="30" x2="440" y2="290"/>
  </g>
</svg>
