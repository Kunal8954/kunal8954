<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" width="400" height="50">
  <defs>
    <filter id="sg3">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Code brackets icon -->
  <g opacity="0" transform="translate(18,25)">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    <text font-family="'Courier New', monospace" font-size="24" fill="#e74c3c" text-anchor="middle" x="0" y="7">&lt;/&gt;</text>
  </g>
  <text x="48" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0"
        filter="url(#sg3)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    tech stack
  </text>
  <line x1="48" y1="36" x2="185" y2="36" stroke="#e74c3c" stroke-width="2" opacity="0"
        stroke-dasharray="137" stroke-dashoffset="137">
    <animate attributeName="stroke-dashoffset" from="137" to="0" dur="0.9s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="0.7" dur="0.9s" begin="0.6s" fill="freeze"/>
  </line>
</svg>
