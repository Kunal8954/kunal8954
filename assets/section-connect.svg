<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" width="400" height="50">
  <defs>
    <filter id="sg4">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Connection icon -->
  <g opacity="0" transform="translate(20,25)">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    <circle cx="-6" cy="-4" r="3" fill="none" stroke="#e74c3c" stroke-width="1.2"/>
    <circle cx="6" cy="4" r="3" fill="none" stroke="#e74c3c" stroke-width="1.2"/>
    <line x1="-3" y1="-2" x2="3" y2="2" stroke="#e74c3c" stroke-width="1.2"/>
  </g>
  <text x="48" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0"
        filter="url(#sg4)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    connect
  </text>
  <line x1="48" y1="36" x2="155" y2="36" stroke="#e74c3c" stroke-width="2" opacity="0"
        stroke-dasharray="107" stroke-dashoffset="107">
    <animate attributeName="stroke-dashoffset" from="107" to="0" dur="0.8s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="0.7" dur="0.8s" begin="0.6s" fill="freeze"/>
  </line>
</svg>
