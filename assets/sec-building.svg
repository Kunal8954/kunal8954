<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 45" width="600" height="45">
  <defs>
    <filter id="hglow1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: box/package -->
  <g opacity="0" transform="translate(20,22)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="20,32" to="20,22" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="-8" y="-6" width="16" height="12" rx="1.5" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
    <line x1="-8" y1="-1" x2="8" y2="-1" stroke="#e74c3c" stroke-width="1"/>
    <line x1="0" y1="-6" x2="0" y2="-1" stroke="#e74c3c" stroke-width="1.2"/>
    <circle cx="0" cy="-8" r="2" fill="#e74c3c" opacity="0.6"/>
  </g>

  <!-- Title text -->
  <text x="48" y="28" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" opacity="0" filter="url(#hglow1)" letter-spacing="0.5">
    what i'm building
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Underline with glow dot -->
  <line x1="48" y1="35" x2="220" y2="35" stroke="#e74c3c" stroke-width="1.5" opacity="0"
        stroke-dasharray="172" stroke-dashoffset="172">
    <animate attributeName="stroke-dashoffset" from="172" to="0" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" from="0" to="0.5" dur="0.8s" begin="0.7s" fill="freeze"/>
  </line>
  <circle cx="48" cy="35" r="2" fill="#e74c3c" opacity="0">
    <animate attributeName="cx" from="48" to="220" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="0.8s" begin="0.7s" fill="freeze"/>
  </circle>
</svg>
