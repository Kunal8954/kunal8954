<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="600" height="80">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cursor blink -->
  <rect x="10" y="15" width="2" height="30" fill="#e74c3c" opacity="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="10;262;262" dur="3s" fill="freeze"/>
  </rect>

  <!-- "Kunal" - each letter fades in sequentially -->
  <g filter="url(#glow)" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">
    <text x="10" y="50" opacity="0">K<tspan opacity="0">u</tspan><tspan opacity="0">n</tspan><tspan opacity="0">a</tspan><tspan opacity="0">l</tspan>
      <animate attributeName="opacity" to="1" dur="0.01s" begin="0.3s" fill="freeze"/>
      <tspan opacity="0">
        <animate attributeName="opacity" to="1" dur="0.01s" begin="0.5s" fill="freeze"/>u</tspan>
      <tspan opacity="0">
        <animate attributeName="opacity" to="1" dur="0.01s" begin="0.7s" fill="freeze"/>n</tspan>
      <tspan opacity="0">
        <animate attributeName="opacity" to="1" dur="0.01s" begin="0.9s" fill="freeze"/>a</tspan>
      <tspan opacity="0">
        <animate attributeName="opacity" to="1" dur="0.01s" begin="1.1s" fill="freeze"/>l</tspan>
    </text>
  </g>

  <!-- "—" dash -->
  <text x="145" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="42" fill="#e74c3c" opacity="0"
        filter="url(#glow)">
    —
    <animate attributeName="opacity" to="0.8" dur="0.01s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Tagline -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#aaaaaa">
    <text x="170" y="48" opacity="0">Data Engineer
      <animate attributeName="opacity" to="1" dur="0.01s" begin="1.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Subtitle line -->
  <text x="170" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#666666" opacity="0">
    self-taught · project-driven · builder
    <animate attributeName="opacity" to="0.8" dur="0.01s" begin="2.2s" fill="freeze"/>
  </text>
</svg>
