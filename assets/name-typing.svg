<svg viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8543a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8543a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softblur"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .nm { font-family: 'Courier New', monospace; font-weight:700; font-size:64px; fill:#f2f2f2; }
      .sub { font-family: 'Courier New', monospace; font-size:19px; fill:#8a8a94; letter-spacing:1px; }
    </style>
  </defs>

  <ellipse cx="350" cy="70" rx="220" ry="60" fill="url(#tglow)" filter="url(#softblur)"/>

  <text x="254" y="88" text-anchor="start" class="nm">
    <tspan opacity="0">K<animate attributeName="opacity" begin="0.0s" dur="0.25s" fill="freeze" to="1"/></tspan><tspan opacity="0">u<animate attributeName="opacity" begin="0.15s" dur="0.25s" fill="freeze" to="1"/></tspan><tspan opacity="0">n<animate attributeName="opacity" begin="0.30s" dur="0.25s" fill="freeze" to="1"/></tspan><tspan opacity="0">a<animate attributeName="opacity" begin="0.45s" dur="0.25s" fill="freeze" to="1"/></tspan><tspan opacity="0">l<animate attributeName="opacity" begin="0.60s" dur="0.25s" fill="freeze" to="1"/></tspan>
  </text>

  <rect x="447" y="46" width="3" height="46" fill="#e8543a" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.85;1" begin="0.60s" dur="1.6s" fill="freeze"/>
  </rect>

  <text x="350" y="128" text-anchor="middle" class="sub" opacity="0">
    Data Engineer in the making — SQL, Python, systems
    <animate attributeName="opacity" begin="1.0s" dur="0.6s" to="1" fill="freeze"/>
  </text>
</svg>
