<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 6" width="600" height="6">
  <line x1="0" y1="3" x2="600" y2="3" stroke="#e74c3c" stroke-width="1" opacity="0"
        stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" from="600" to="0" dur="1.5s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" from="0" to="0.6" dur="1.5s" begin="0s" fill="freeze"/>
  </line>
  <!-- Glow dot traveling along the line -->
  <circle cx="0" cy="3" r="2.5" fill="#e74c3c" opacity="0.8">
    <animate attributeName="cx" from="0" to="600" dur="1.5s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" values="0.8;1;0" dur="1.5s" begin="0s" fill="freeze"/>
  </circle>
</svg>
