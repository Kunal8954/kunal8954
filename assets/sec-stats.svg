<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 45" width="600" height="45">
  <defs>
    <filter id="hglow4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: bar chart -->
  <g opacity="0" transform="translate(20,22)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="20,32" to="20,22" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="-9" y="2" width="4" height="8" rx="1" fill="#e74c3c" opacity="0.7"/>
    <rect x="-3" y="-4" width="4" height="14" rx="1" fill="#e74c3c" opacity="0.85"/>
    <rect x="3" y="-1" width="4" height="11" rx="1" fill="#e74c3c" opacity="0.75"/>
    <rect x="9" y="-6" width="4" height="16" rx="1" fill="#e74c3c"/>
  </g>

  <text x="48" y="28" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" opacity="0" filter="url(#hglow4)" letter-spacing="0.5">
    github stats
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="0.5s" fill="freeze"/>
  </text>

  <line x1="48" y1="35" x2="198" y2="35" stroke="#e74c3c" stroke-width="1.5" opacity="0"
        stroke-dasharray="150" stroke-dashoffset="150">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" from="0" to="0.5" dur="0.8s" begin="0.7s" fill="freeze"/>
  </line>
  <circle cx="48" cy="35" r="2" fill="#e74c3c" opacity="0">
    <animate attributeName="cx" from="48" to="198" dur="0.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="0.8s" begin="0.7s" fill="freeze"/>
  </circle>
</svg>
