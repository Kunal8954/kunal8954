<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 50" width="300" height="50">
  <defs>
    <filter id="sg">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Spider icon -->
  <g opacity="0" transform="translate(20,25)">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    <circle cx="0" cy="0" r="4" fill="#e74c3c"/>
    <circle cx="0" cy="-1.5" r="1.2" fill="#ffffff" opacity="0.9"/>
    <!-- Legs -->
    <line x1="-3" y1="-2" x2="-8" y2="-7" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-3" y1="0" x2="-9" y2="-1" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-3" y1="2" x2="-8" y2="6" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2" y1="3" x2="-6" y2="8" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="3" y1="-2" x2="8" y2="-7" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="3" y1="0" x2="9" y2="-1" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="3" y1="2" x2="8" y2="6" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="2" y1="3" x2="6" y2="8" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Section title -->
  <text x="45" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0"
        filter="url(#sg)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    about
  </text>
  <!-- Underline -->
  <line x1="45" y1="36" x2="120" y2="36" stroke="#e74c3c" stroke-width="2" opacity="0"
        stroke-dasharray="75" stroke-dashoffset="75">
    <animate attributeName="stroke-dashoffset" from="75" to="0" dur="0.8s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="0.7" dur="0.8s" begin="0.6s" fill="freeze"/>
  </line>
</svg>
