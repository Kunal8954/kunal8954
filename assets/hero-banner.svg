<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Sky gradient: deep navy to black -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="40%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#0d0815"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="92%" cy="12%" r="12%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ff2222" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <!-- Rim light filter for spider figure -->
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.2 0 0 0  0 0 0.2 0 0  0 0 0 0.6 0" result="redBlur"/>
      <feMerge>
        <feMergeNode in="redBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Web impact glow -->
    <radialGradient id="impactGlow">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="1200" height="500" fill="url(#skyGrad)"/>
  <rect width="1200" height="500" fill="url(#moonGlow)"/>

  <!-- Distant stars -->
  <circle cx="80" cy="40" r="1" fill="#fff" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="75" r="1.3" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="370" cy="25" r="0.9" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="530" cy="55" r="1.1" fill="#fff" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="35" r="1" fill="#fff" opacity="0.55"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="50" r="1.2" fill="#fff" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1020" cy="30" r="0.8" fill="#fff" opacity="0.65"><animate attributeName="opacity" values="0.65;0.18;0.65" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="1150" cy="60" r="1" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="100" r="0.7" fill="#fff" opacity="0.35"><animate attributeName="opacity" values="0.35;0.05;0.35" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="85" r="1" fill="#fff" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="20" r="0.9" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="70" r="1.1" fill="#fff" opacity="0.3"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="5.2s" repeatCount="indefinite"/></circle>

  <!-- ===== CITYSCAPE — Layer 1 (farthest, slowest parallax feel via opacity) ===== -->
  <g fill="#06060f" opacity="0.7">
    <rect x="0" y="320" width="55" height="180"/>
    <rect x="50" y="280" width="40" height="220"/>
    <rect x="85" y="300" width="65" height="200"/>
    <rect x="145" y="260" width="38" height="240"/>
    <rect x="178" y="290" width="52" height="210"/>
    <rect x="225" y="310" width="48" height="190"/>
    <rect x="268" y="270" width="60" height="230"/>
    <rect x="323" y="295" width="42" height="205"/>
    <rect x="360" y="250" width="50" height="250"/>
    <rect x="405" y="285" width="55" height="215"/>
    <rect x="455" y="305" width="38" height="195"/>
    <rect x="488" y="265" width="65" height="235"/>
    <rect x="548" y="290" width="45" height="210"/>
    <rect x="588" y="275" width="50" height="225"/>
    <rect x="633" y="300" width="42" height="200"/>
    <rect x="670" y="255" width="55" height="245"/>
    <rect x="720" y="285" width="48" height="215"/>
    <rect x="763" y="310" width="60" height="190"/>
    <rect x="818" y="270" width="40" height="230"/>
    <rect x="853" y="290" width="52" height="210"/>
    <rect x="900" y="255" width="45" height="245"/>
    <rect x="940" y="280" width="55" height="220"/>
    <rect x="990" y="305" width="42" height="195"/>
    <rect x="1027" y="265" width="50" height="235"/>
    <rect x="1072" y="290" width="60" height="210"/>
    <rect x="1127" y="310" width="48" height="190"/>
    <rect x="1170" y="275" width="40" height="225"/>
  </g>

  <!-- ===== CITYSCAPE — Layer 2 (mid) ===== -->
  <g fill="#08081a" opacity="0.85">
    <rect x="10" y="340" width="65" height="160"/>
    <rect x="70" y="300" width="50" height="200"/>
    <rect x="115" y="325" width="72" height="175"/>
    <rect x="182" y="285" width="45" height="215"/>
    <rect x="222" y="315" width="58" height="185"/>
    <rect x="275" y="335" width="52" height="165"/>
    <rect x="322" y="290" width="68" height="210"/>
    <rect x="385" y="318" width="48" height="182"/>
    <rect x="428" y="275" width="58" height="225"/>
    <rect x="481" y="310" width="62" height="190"/>
    <rect x="538" y="330" width="45" height="170"/>
    <rect x="578" y="282" width="72" height="218"/>
    <rect x="645" y="308" width="50" height="192"/>
    <rect x="690" y="292" width="55" height="208"/>
    <rect x="740" y="318" width="48" height="182"/>
    <rect x="783" y="272" width="60" height="228"/>
    <rect x="838" y="305" width="52" height="195"/>
    <rect x="885" y="328" width="65" height="172"/>
    <rect x="945" y="288" width="42" height="212"/>
    <rect x="982" y="310" width="55" height="190"/>
    <rect x="1032" y="275" width="50" height="225"/>
    <rect x="1077" y="300" width="62" height="200"/>
    <rect x="1134" y="320" width="48" height="180"/>
    <rect x="1177" y="290" width="35" height="210"/>
  </g>

  <!-- ===== CITYSCAPE — Layer 3 (foreground, darkest) ===== -->
  <g fill="#0b0b22">
    <rect x="0" y="360" width="78" height="140"/>
    <rect x="73" y="320" width="58" height="180"/>
    <rect x="126" y="348" width="80" height="152"/>
    <rect x="201" y="310" width="50" height="190"/>
    <rect x="246" y="340" width="65" height="160"/>
    <rect x="306" y="355" width="55" height="145"/>
    <rect x="356" y="315" width="75" height="185"/>
    <rect x="426" y="342" width="52" height="158"/>
    <rect x="473" y="298" width="62" height="202"/>
    <rect x="530" y="335" width="68" height="165"/>
    <rect x="593" y="350" width="50" height="150"/>
    <rect x="638" y="305" width="78" height="195"/>
    <rect x="711" y="332" width="55" height="168"/>
    <rect x="761" y="318" width="60" height="182"/>
    <rect x="816" y="345" width="50" height="155"/>
    <rect x="861" y="295" width="68" height="205"/>
    <rect x="924" y="328" width="58" height="172"/>
    <rect x="977" y="352" width="72" height="148"/>
    <rect x="1044" y="312" width="48" height="188"/>
    <rect x="1087" y="338" width="58" height="162"/>
    <rect x="1140" y="300" width="65" height="200"/>
  </g>

  <!-- Building window lights (scattered, blinking) -->
  <g fill="#e74c3c">
    <rect x="88" y="335" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="96" y="350" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="210" y="325" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="330" y="330" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="370" y="305" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5.5s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="490" y="320" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="550" y="315" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect x="650" y="322" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5.2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="770" y="335" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="870" y="310" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="1.8s" repeatCount="indefinite"/></rect>
    <rect x="950" y="340" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="1050" y="325" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="4.3s" begin="2.2s" repeatCount="indefinite"/></rect>
    <rect x="1150" y="315" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="5.8s" begin="1.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Subtle web pattern overlay -->
  <g stroke="#ffffff" stroke-width="0.25" opacity="0.025" fill="none">
    <circle cx="600" cy="250" r="80"/>
    <circle cx="600" cy="250" r="160"/>
    <circle cx="600" cy="250" r="240"/>
    <circle cx="600" cy="250" r="320"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="350" y1="0" x2="850" y2="500"/>
    <line x1="850" y1="0" x2="350" y2="500"/>
    <line x1="200" y1="250" x2="1000" y2="250"/>
    <line x1="380" y1="60" x2="820" y2="440"/>
    <line x1="820" y1="60" x2="380" y2="440"/>
  </g>

  <!-- ===== WEB ATTACHMENT POINT (building corner) ===== -->
  <g>
    <!-- Impact glow at attachment -->
    <circle cx="380" cy="310" r="15" fill="url(#impactGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.3;0.6;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="310" r="8" fill="url(#impactGlow)" opacity="0">
      <animate attributeName="opacity" values="0;1;0.4;0.7;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Star pattern strands from attachment -->
    <g stroke="#888888" stroke-width="0.6" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0.3;0.5;0.3" dur="5.5s" repeatCount="indefinite"/>
      <line x1="380" y1="310" x2="365" y2="295"/>
      <line x1="380" y1="310" x2="395" y2="295"/>
      <line x1="380" y1="310" x2="380" y2="290"/>
      <line x1="380" y1="310" x2="370" y2="305"/>
      <line x1="380" y1="310" x2="392" y2="305"/>
    </g>
    <!-- Ripple rings -->
    <circle cx="380" cy="310" r="5" fill="none" stroke="#e74c3c" stroke-width="0.8" opacity="0">
      <animate attributeName="r" from="5" to="25" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="310" r="5" fill="none" stroke="#e74c3c" stroke-width="0.5" opacity="0">
      <animate attributeName="r" from="5" to="35" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.3" to="0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== MAIN WEB STRAND (from attachment to spider hand) ===== -->
  <!-- This line animates with the figure via animateMotion on a group -->
  <!-- Static anchor strand — from building corner to where figure passes -->
  <line x1="380" y1="310" x2="600" y2="100" stroke="#999999" stroke-width="1" opacity="0.4"
        stroke-dasharray="350" stroke-dashoffset="350">
    <animate attributeName="stroke-dashoffset" from="350" to="0" dur="1.5s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="0.4;0.6;0.35;0.55;0.35" dur="5.5s" begin="1.7s" repeatCount="indefinite"/>
  </line>
  <line x1="380" y1="310" x2="580" y2="85" stroke="#777777" stroke-width="0.6" opacity="0.3"
        stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.5s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0.3;0.5;0.25;0.45;0.25" dur="5.5s" begin="1.9s" repeatCount="indefinite"/>
  </line>

  <!-- ===== SPIDER-MAN FIGURE (large, ~60-70% of banner height) ===== -->
  <g filter="url(#rimGlow)">
    <animateMotion
      dur="5.5s"
      repeatCount="indefinite"
      path="M420,60 C480,140 560,300 620,340 S750,280 850,120 S920,50 980,30"
      rotate="auto"
      calcMode="spline"
      keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
      keyTimes="0; 0.25; 0.55; 0.8; 1"
    />

    <!-- === FULL BODY SILHOUETTE === -->
    <g transform="translate(0,0) scale(2.8)">
      <!-- Head -->
      <ellipse cx="0" cy="-24" rx="10" ry="11" fill="#1a0a0a"/>
      <!-- Eyes -->
      <path d="M-6,-26 Q-2,-28 0,-25 Q-2,-22 -6,-23 Z" fill="#e74c3c" opacity="0.9"/>
      <path d="M6,-26 Q2,-28 0,-25 Q2,-22 6,-23 Z" fill="#e74c3c" opacity="0.9"/>
      <!-- Neck -->
      <rect x="-4" y="-14" width="8" height="5" fill="#1a0a0a" rx="2"/>
      <!-- Torso -->
      <path d="M-12,-10 Q-14,5 -10,18 L10,18 Q14,5 12,-10 Z" fill="#1a0a0a"/>
      <!-- Chest emblem (minimal spider) -->
      <ellipse cx="0" cy="2" rx="2.5" ry="3" fill="#e74c3c" opacity="0.7"/>
      <!-- LEFT ARM — extended forward, web-shooting pose -->
      <path d="M-12,-6 Q-22,-14 -34,-18" fill="none" stroke="#1a0a0a" stroke-width="5" stroke-linecap="round"/>
      <!-- Left forearm -->
      <path d="M-34,-18 Q-40,-16 -44,-14" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>
      <!-- LEFT HAND — web-shooter open palm -->
      <path d="M-44,-14 L-48,-16 M-44,-14 L-48,-12 M-44,-14 L-47,-10 M-44,-14 L-46,-8" fill="none" stroke="#1a0a0a" stroke-width="2" stroke-linecap="round"/>
      <!-- Web shooter nozzle -->
      <circle cx="-45" cy="-14" r="1.5" fill="#e74c3c" opacity="0.8"/>

      <!-- RIGHT ARM — pulled back for momentum -->
      <path d="M12,-6 Q18,4 20,12" fill="none" stroke="#1a0a0a" stroke-width="5" stroke-linecap="round"/>
      <path d="M20,12 Q22,16 24,14" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- LEFT LEG — bent, trailing behind -->
      <path d="M-6,18 Q-14,30 -18,42" fill="none" stroke="#1a0a0a" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M-18,42 Q-22,48 -20,52" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- RIGHT LEG — bent forward, momentum -->
      <path d="M6,18 Q12,28 16,40" fill="none" stroke="#1a0a0a" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M16,40 Q20,46 22,44" fill="none" stroke="#1a0a0a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Suit web lines (subtle pattern on body) -->
      <g stroke="#333333" stroke-width="0.4" fill="none" opacity="0.5">
        <line x1="0" y1="-14" x2="-8" y2="10"/>
        <line x1="0" y1="-14" x2="8" y2="10"/>
        <line x1="0" y1="-14" x2="0" y2="16"/>
        <line x1="-6" y1="0" x2="6" y2="0"/>
        <line x1="-9" y1="8" x2="9" y2="8"/>
      </g>

      <!-- Web lines shooting from left hand -->
      <g stroke="#bbbbbb" stroke-width="0.6" fill="none" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0.4;0.6;0.4" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
        <line x1="-48" y1="-14" x2="-60" y2="-40" stroke-dasharray="30" stroke-dashoffset="30">
          <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.4s" begin="0.8s" fill="freeze"/>
        </line>
        <line x1="-48" y1="-14" x2="-55" y2="-45" stroke-dasharray="35" stroke-dashoffset="35">
          <animate attributeName="stroke-dashoffset" from="35" to="0" dur="0.4s" begin="0.9s" fill="freeze"/>
        </line>
        <line x1="-48" y1="-14" x2="-65" y2="-35" stroke-dasharray="28" stroke-dashoffset="28">
          <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.4s" begin="1s" fill="freeze"/>
        </line>
      </g>
    </g>
  </g>

  <!-- Bottom fade to blend with README background -->
  <rect x="0" y="430" width="1200" height="70" fill="#0d0815" opacity="0.8"/>
</svg>
