<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Sky gradient: deep navy to black -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="40%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#0d0815"/>
    </linearGradient>
    <!-- Moon glow (red ambient, top corner) -->
    <radialGradient id="moonGlow" cx="88%" cy="10%" r="14%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.20"/>
      <stop offset="40%" stop-color="#ff2222" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <!-- Rim light for figure edge -->
    <filter id="rimGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.18 0 0 0  0 0 0.18 0 0  0 0 0 0.55 0" result="redBlur"/>
      <feMerge><feMergeNode in="redBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Impact glow at web anchor -->
    <radialGradient id="impactGlow">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1200" height="500" fill="url(#skyGrad)"/>
  <rect width="1200" height="500" fill="url(#moonGlow)"/>

  <!-- Distant stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="42" r="1"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="78" r="1.3"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="28" r="0.9"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="58" r="1.1"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="30" r="1"><animate attributeName="opacity" values="0.55;0.12;0.55" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="102" r="0.7"><animate attributeName="opacity" values="0.35;0.05;0.35" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="88" r="1"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="22" r="0.9"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="48" r="1.2"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="70" r="1.1"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Cityscape layer 1 (farthest) -->
  <g fill="#06060f" opacity="0.7">
    <rect x="0" y="320" width="55" height="180"/><rect x="50" y="280" width="40" height="220"/>
    <rect x="85" y="300" width="65" height="200"/><rect x="145" y="260" width="38" height="240"/>
    <rect x="178" y="290" width="52" height="210"/><rect x="225" y="310" width="48" height="190"/>
    <rect x="268" y="270" width="60" height="230"/><rect x="323" y="295" width="42" height="205"/>
    <rect x="360" y="250" width="50" height="250"/><rect x="405" y="285" width="55" height="215"/>
    <rect x="455" y="305" width="38" height="195"/><rect x="488" y="265" width="65" height="235"/>
    <rect x="548" y="290" width="45" height="210"/><rect x="588" y="275" width="50" height="225"/>
    <rect x="633" y="300" width="42" height="200"/><rect x="670" y="255" width="55" height="245"/>
    <rect x="720" y="285" width="48" height="215"/><rect x="763" y="310" width="60" height="190"/>
    <rect x="818" y="270" width="40" height="230"/><rect x="853" y="290" width="52" height="210"/>
    <rect x="900" y="255" width="45" height="245"/><rect x="940" y="280" width="55" height="220"/>
    <rect x="990" y="305" width="42" height="195"/><rect x="1027" y="265" width="50" height="235"/>
    <rect x="1072" y="290" width="60" height="210"/><rect x="1127" y="310" width="48" height="190"/>
    <rect x="1170" y="275" width="40" height="225"/>
  </g>

  <!-- Cityscape layer 2 (mid) -->
  <g fill="#08081a" opacity="0.85">
    <rect x="10" y="340" width="65" height="160"/><rect x="70" y="300" width="50" height="200"/>
    <rect x="115" y="325" width="72" height="175"/><rect x="182" y="285" width="45" height="215"/>
    <rect x="222" y="315" width="58" height="185"/><rect x="275" y="335" width="52" height="165"/>
    <rect x="322" y="290" width="68" height="210"/><rect x="385" y="318" width="48" height="182"/>
    <rect x="428" y="275" width="58" height="225"/><rect x="481" y="310" width="62" height="190"/>
    <rect x="538" y="330" width="45" height="170"/><rect x="578" y="282" width="72" height="218"/>
    <rect x="645" y="308" width="50" height="192"/><rect x="690" y="292" width="55" height="208"/>
    <rect x="740" y="318" width="48" height="182"/><rect x="783" y="272" width="60" height="228"/>
    <rect x="838" y="305" width="52" height="195"/><rect x="885" y="328" width="65" height="172"/>
    <rect x="945" y="288" width="42" height="212"/><rect x="982" y="310" width="55" height="190"/>
    <rect x="1032" y="275" width="50" height="225"/><rect x="1077" y="300" width="62" height="200"/>
    <rect x="1134" y="320" width="48" height="180"/><rect x="1177" y="290" width="35" height="210"/>
  </g>

  <!-- Cityscape layer 3 (foreground, darkest) -->
  <g fill="#0b0b22">
    <rect x="0" y="360" width="78" height="140"/><rect x="73" y="320" width="58" height="180"/>
    <rect x="126" y="348" width="80" height="152"/><rect x="201" y="310" width="50" height="190"/>
    <rect x="246" y="340" width="65" height="160"/><rect x="306" y="355" width="55" height="145"/>
    <rect x="356" y="315" width="75" height="185"/><rect x="426" y="342" width="52" height="158"/>
    <rect x="473" y="298" width="62" height="202"/><rect x="530" y="335" width="68" height="165"/>
    <rect x="593" y="350" width="50" height="150"/><rect x="638" y="305" width="78" height="195"/>
    <rect x="711" y="332" width="55" height="168"/><rect x="761" y="318" width="60" height="182"/>
    <rect x="816" y="345" width="50" height="155"/><rect x="861" y="295" width="68" height="205"/>
    <rect x="924" y="328" width="58" height="172"/><rect x="977" y="352" width="72" height="148"/>
    <rect x="1044" y="312" width="48" height="188"/><rect x="1087" y="338" width="58" height="162"/>
    <rect x="1140" y="300" width="65" height="200"/>
  </g>

  <!-- Blinking window lights -->
  <g fill="#e74c3c">
    <rect x="88" y="335" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="210" y="325" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="330" y="330" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="490" y="320" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="550" y="315" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect x="650" y="322" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5.2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="770" y="335" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="4.8s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="870" y="310" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="1.8s" repeatCount="indefinite"/></rect>
    <rect x="950" y="340" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="1050" y="325" width="3" height="3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="4.3s" begin="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Subtle web pattern overlay -->
  <g stroke="#ffffff" stroke-width="0.25" opacity="0.025" fill="none">
    <circle cx="600" cy="250" r="80"/><circle cx="600" cy="250" r="160"/>
    <circle cx="600" cy="250" r="240"/><circle cx="600" cy="250" r="320"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="350" y1="0" x2="850" y2="500"/>
    <line x1="850" y1="0" x2="350" y2="500"/><line x1="200" y1="250" x2="1000" y2="250"/>
  </g>

  <!-- ===================== ANTENNA BUILDING (web anchor, upper-LEFT) ===================== -->
  <g>
    <!-- tall building with antenna -->
    <rect x="235" y="165" width="48" height="335" fill="#0b0b22"/>
    <rect x="255" y="250" width="8" height="18" fill="#e74c3c" opacity="0.35"/>
    <!-- antenna mast -->
    <line x1="259" y1="165" x2="259" y2="72" stroke="#0b0b22" stroke-width="4" stroke-linecap="round"/>
    <!-- anchor glow at antenna tip -->
    <circle cx="259" cy="72" r="22" fill="url(#impactGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.3;0.6;0.3" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="259" cy="72" r="7" fill="none" stroke="#e74c3c" stroke-width="0.9" opacity="0">
      <animate attributeName="r" from="5" to="28" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="259" cy="72" r="2.5" fill="#e74c3c" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== SPIDER FIGURE + SINGLE WEB STRAND =====================
       The whole assembly (strand + figure) translates as a rigid pendulum along a wide
       upper-LEFT → lower-RIGHT swooping arc, kept ALWAYS inside the canvas frame.
       No auto-rotate (which would tumble the figure); a fixed forward lean keeps the
       body upright like a real web-swinger. The strand is drawn INSIDE the group so it
       swings with the figure and always points back toward the antenna anchor. -->

  <g filter="url(#rimGlow)">
    <animateMotion
      dur="5.2s"
      repeatCount="indefinite"
      path="M355,345
           C480,415 620,420 720,412
           C800,395 842,378 838,360
           C830,335 760,325 660,350
           C580,370 480,376 420,368
           C395,362 370,349 355,345 Z"
    />

    <!-- ===== WEB STRAND — ONE line, subtle catenary sag, hand → up-left toward antenna =====
         Drawn INSIDE the figure group so it shares the exact scale/rotate transform and
         stays glued to the front hand (local hand pos ≈ (108,-198)). Curves up-left. -->
    <path d="M66,-297 C0,-300 -60,-318 -120,-340"
          fill="none" stroke="#9aa0aa" stroke-width="1.6"
          opacity="0" stroke-linecap="round"
          stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.4s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.5;0.38;0.46;0.38" dur="5.2s" begin="1.7s" repeatCount="indefinite"/>
    </path>
    <!-- thin white sheen on top of strand -->
    <path d="M66,-297 C0,-300 -60,-318 -120,-340"
          fill="none" stroke="#ffffff" stroke-width="0.5"
          opacity="0" stroke-linecap="round"
          stroke-dasharray="200" stroke-dashoffset="200">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.4s" begin="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.18;0.1;0.16;0.1" dur="5.2s" begin="1.7s" repeatCount="indefinite"/>
    </path>

    <!-- ===== FIGURE — large humanoid, dynamic mid-swing pose, fixed forward lean =====
         Built around torso origin (0,0). height ≈ 285px (~57% of 500px banner). -->
    <g transform="scale(1.35) rotate(16)">
      <!-- === HEAD (up-left) === -->
      <g transform="translate(-6,-150)">
        <ellipse cx="0" cy="0" rx="22" ry="24" fill="#160a0a"/>
        <!-- Eyes (angular lenses) -->
        <path d="M-12,-2 Q-4,-8 2,-4 Q-4,2 -11,4 Z" fill="#e74c3c" opacity="0.95"/>
        <path d="M4,-2 Q12,-8 16,-1 Q9,5 5,3 Z" fill="#e74c3c" opacity="0.85"/>
      </g>

      <!-- === TORSO (solid filled shape) === -->
      <path d="M-40,-128 C-52,-100 -48,-60 -34,-28 L-18,-10 L22,-14 C36,-58 36,-100 24,-128 Z"
            fill="#160a0a"/>
      <!-- chest emblem (minimal spider) -->
      <g transform="translate(-4,-80)">
        <ellipse cx="0" cy="0" rx="11" ry="13" fill="#e74c3c" opacity="0.6"/>
        <circle cx="0" cy="0" r="2.5" fill="#160a0a"/>
        <line x1="-8" y1="-4" x2="-4" y2="-1" stroke="#160a0a" stroke-width="0.9"/>
        <line x1="8" y1="-4" x2="4" y2="-1" stroke="#160a0a" stroke-width="0.9"/>
      </g>

      <!-- === FRONT ARM — extended forward/up, web-shooting === -->
      <path d="M30,-118 Q70,-150 96,-180" fill="none" stroke="#160a0a" stroke-width="20" stroke-linecap="round"/>
      <path d="M96,-180 Q104,-190 108,-198" fill="none" stroke="#160a0a" stroke-width="16" stroke-linecap="round"/>
      <!-- open hand -->
      <g transform="translate(108,-198)">
        <path d="M0,0 L8,-6 M0,0 L10,-2 M0,0 L9,3 M0,0 L5,7 M0,-2 L7,-9" fill="none" stroke="#160a0a" stroke-width="3.5" stroke-linecap="round"/>
        <!-- hand web-burst (toward strand direction, up-left) -->
        <path d="M0,0 L-22,-26 M2,-1 L-14,-32 M-2,1 L-28,-18" fill="none" stroke="#9aa0aa" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.6;0.3;0.5;0.3" dur="5.2s" begin="0.5s" repeatCount="indefinite"/></path>
      </g>
      <!-- web-shooter nozzle glow -->
      <circle cx="104" cy="-192" r="3" fill="#e74c3c" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0.3;0.8;0" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>

      <!-- === BACK ARM — trailing behind/down === -->
      <path d="M-30,-118 Q-60,-80 -70,-46" fill="none" stroke="#160a0a" stroke-width="17" stroke-linecap="round"/>
      <path d="M-70,-46 Q-78,-30 -82,-22" fill="none" stroke="#160a0a" stroke-width="13" stroke-linecap="round"/>

      <!-- === BACK LEG — extended behind (down-left) === -->
      <path d="M-14,-16 Q-46,-8 -74,6" fill="none" stroke="#160a0a" stroke-width="22" stroke-linecap="round"/>
      <path d="M-74,6 Q-92,16 -100,28" fill="none" stroke="#160a0a" stroke-width="17" stroke-linecap="round"/>
      <path d="M-100,28 L-112,36" fill="none" stroke="#160a0a" stroke-width="10" stroke-linecap="round"/>

      <!-- === FRONT LEG — tucked, bent forward (knee up) === -->
      <path d="M12,-18 Q40,-14 42,8" fill="none" stroke="#160a0a" stroke-width="22" stroke-linecap="round"/>
      <path d="M42,8 Q34,26 26,38" fill="none" stroke="#160a0a" stroke-width="17" stroke-linecap="round"/>
      <path d="M26,38 L22,50" fill="none" stroke="#160a0a" stroke-width="10" stroke-linecap="round"/>

      <!-- subtle web pattern on torso -->
      <g stroke="#2a2a2a" stroke-width="0.6" fill="none" opacity="0.5">
        <path d="M-30,-120 Q-6,-90 14,-24"/>
        <path d="M24,-124 Q4,-88 -20,-20"/>
        <line x1="-34" y1="-70" x2="26" y2="-70"/>
      </g>
    </g>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="430" width="1200" height="70" fill="#0d0815" opacity="0.8"/>
</svg>