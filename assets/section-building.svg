<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" width="400" height="50">
  <defs>
    <filter id="sg2">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Web icon -->
  <g opacity="0" transform="translate(20,25)">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#e74c3c" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#e74c3c" stroke-width="0.8"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#e74c3c" stroke-width="0.8"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#e74c3c" stroke-width="0.8"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#e74c3c" stroke-width="0.8"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#e74c3c" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#e74c3c"/>
  </g>
  <text x="45" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0"
        filter="url(#sg2)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.3s" fill="freeze"/>
    what i'm building
  </text>
  <line x1="45" y1="36" x2="245" y2="36" stroke="#e74c3c" stroke-width="2" opacity="0"
        stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1s" begin="0.6s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="0.7" dur="1s" begin="0.6s" fill="freeze"/>
  </line>
</svg>
